<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Schorle Teller</title>
<meta name="description" content="Houd je Schorles bij op de Bad Dürkheim Wurstmarkt">
<meta name="theme-color" content="#7a1f2b">

<!-- PWA / Android -->
<link rel="manifest" href="manifest.json">

<!-- iOS PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schorle">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <header class="header">
    <h1>🍷 Schorle Teller</h1>
    <p class="subtitle">Bad Dürkheim Wurstmarkt</p>
  </header>

  <main class="counter-card">
    <div class="count-display">
      <span id="count">0</span>
      <span class="count-label">Schorles</span>
    </div>

    <button id="addBtn" class="btn-add" aria-label="Schorle toevoegen">
      + Schorle
    </button>

    <div class="secondary-actions">
      <button id="undoBtn" class="btn-secondary">↺ Undo</button>
      <button id="resetBtn" class="btn-secondary btn-danger">Reset</button>
    </div>
  </main>

  <section class="stats-card">
    <div class="stat">
      <span class="stat-value" id="todayCount">0</span>
      <span class="stat-name">Vandaag</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="totalCost">€0,00</span>
      <span class="stat-name">Totaal uitgegeven</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="lastTime">–</span>
      <span class="stat-name">Laatste</span>
    </div>
  </section>

  <section class="group-card" id="groupCard" hidden>
    <div id="groupIntro">
      <h2>Groep</h2>
      <p class="group-hint">Speel samen: zie de tussenstand van je vrienden op de Wurstmarkt.</p>
      <div class="group-toggle">
        <button id="showCreateForm" class="btn-secondary">Groep aanmaken</button>
        <button id="showJoinForm" class="btn-secondary">Groep joinen</button>
      </div>
      <form id="createForm" class="group-form" hidden>
        <input id="createGroupName" placeholder="Naam groep (bv. Wurstmarkt 2026)" required maxlength="40">
        <input id="createYourName" placeholder="Jouw naam" required maxlength="30">
        <button type="submit" class="btn-add btn-small">Aanmaken</button>
      </form>
      <form id="joinForm" class="group-form" hidden>
        <input id="joinCode" placeholder="Groepscode" required maxlength="8" style="text-transform:uppercase">
        <input id="joinYourName" placeholder="Jouw naam" required maxlength="30">
        <button type="submit" class="btn-add btn-small">Meedoen</button>
      </form>
      <p id="groupError" class="group-error" hidden></p>
    </div>

    <div id="groupActive" hidden>
      <div class="group-header">
        <div>
          <h2 id="groupName"></h2>
          <p class="group-code">Code: <strong id="groupCode"></strong> · <button id="copyLink" class="link-btn">kopieer link</button></p>
        </div>
        <button id="leaveGroup" class="link-btn link-danger">Verlaten</button>
      </div>
      <ul id="standingsList" class="standings-list"></ul>
    </div>
  </section>

  <section class="settings-card">
    <label for="priceInput">Prijs per Schorle (€)</label>
    <input type="number" id="priceInput" min="0" step="0.10" inputmode="decimal">
  </section>

  <section class="history-card">
    <h2>Geschiedenis</h2>
    <ul id="historyList" class="history-list"></ul>
    <p id="emptyState" class="empty-state">Nog geen Schorles gelogd. Proost! 🥂</p>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/group.js"></script>
<script src="js/app.js"></script>
</body>
</html>
